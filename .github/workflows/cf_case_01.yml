name: CF-CASE-01 Build Campi Flegrei Timeline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-case-study:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install pandas matplotlib

      - name: Validate required input files
        run: |
          required_files=(
            "cgie2/src/build_cf_campi_flegrei_timeline.py"
            "outputs/CF_RETRO_01_global_alerts.csv"
            "outputs/CF_RETRO_01_catalog_frozen.csv"
          )

          for file in "${required_files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "ERROR: required file is absent or empty: $file"
              exit 1
            fi

            echo "FOUND: $file"
            ls -lh "$file"
          done

      - name: Check Python syntax
        run: |
          python -m py_compile \
            cgie2/src/build_cf_campi_flegrei_timeline.py

          echo "Python syntax validation passed."

      - name: Execute CF-CASE-01
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python \
            cgie2/src/build_cf_campi_flegrei_timeline.py

      - name: Verify generated outputs
        run: |
          generated_files=(
            "outputs/CF_CASE_01_campi_flegrei_timeline.csv"
            "outputs/CF_CASE_01_campi_flegrei_timeline.png"
            "outputs/CF_CASE_01_non_normal_episodes.csv"
            "outputs/CF_CASE_01_summary.json"
          )

          for file in "${generated_files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "ERROR: generated output is absent or empty: $file"
              exit 1
            fi

            echo "GENERATED: $file"
            ls -lh "$file"
          done

      - name: Validate summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("outputs/CF_CASE_01_summary.json")

          summary = json.loads(
              path.read_text(encoding="utf-8")
          )

          if summary.get("case_id") != "CF_CASE_01":
              raise SystemExit(
                  "ERROR: unexpected case identifier."
              )

          if summary.get("location") != "Campi Flegrei":
              raise SystemExit(
                  "ERROR: unexpected case-study location."
              )

          alert_rows = int(
              summary.get("alert_rows", 0)
          )

          if alert_rows <= 0:
              raise SystemExit(
                  "ERROR: no alert rows were analysed."
              )

          episode_count = int(
              summary.get("episode_count", -1)
          )

          if episode_count < 0:
              raise SystemExit(
                  "ERROR: invalid episode count."
              )

          fraction = float(
              summary.get(
                  "non_normal_fraction",
                  -1.0,
              )
          )

          if not 0.0 <= fraction <= 1.0:
              raise SystemExit(
                  "ERROR: invalid non-normal fraction."
              )

          target = summary.get(
              "target_event",
              {},
          )

          if (
              target.get("time_utc")
              != "2026-07-31T17:46:43+00:00"
          ):
              raise SystemExit(
                  "ERROR: unexpected target event time."
              )

          print("CF-CASE-01 summary validation passed.")
          print(
              f"Alert rows: {alert_rows}"
          )
          print(
              f"Non-normal episodes: {episode_count}"
          )
          print(
              "Non-normal fraction: "
              f"{fraction:.6f}"
          )
          PY

      - name: Create workflow provenance
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from hashlib import sha256
          from pathlib import Path

          files = [
              Path(
                  "cgie2/src/"
                  "build_cf_campi_flegrei_timeline.py"
              ),
              Path(
                  "outputs/"
                  "CF_RETRO_01_global_alerts.csv"
              ),
              Path(
                  "outputs/"
                  "CF_RETRO_01_catalog_frozen.csv"
              ),
              Path(
                  "outputs/"
                  "CF_CASE_01_campi_flegrei_timeline.csv"
              ),
              Path(
                  "outputs/"
                  "CF_CASE_01_campi_flegrei_timeline.png"
              ),
              Path(
                  "outputs/"
                  "CF_CASE_01_non_normal_episodes.csv"
              ),
              Path(
                  "outputs/"
                  "CF_CASE_01_summary.json"
              ),
          ]

          hashes = {}

          for path in files:
              digest = sha256(
                  path.read_bytes()
              ).hexdigest()

              hashes[str(path)] = digest

          payload = {
              "case_id": "CF_CASE_01",
              "generated_at_utc": (
                  datetime.now(timezone.utc)
                  .isoformat()
              ),
              "git_commit": os.environ.get(
                  "GITHUB_SHA"
              ),
              "github_run_id": os.environ.get(
                  "GITHUB_RUN_ID"
              ),
              "github_run_attempt": os.environ.get(
                  "GITHUB_RUN_ATTEMPT"
              ),
              "workflow": os.environ.get(
                  "GITHUB_WORKFLOW"
              ),
              "file_sha256": hashes,
          }

          output = Path(
              "outputs/"
              "CF_CASE_01_workflow_provenance.json"
          )

          output.write_text(
              json.dumps(
                  payload,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )

          print(f"Generated: {output}")
          PY

      - name: Upload CF-CASE-01 artifact
        uses: actions/upload-artifact@v4
        with:
          name: CF-CASE-01-campi-flegrei
          path: |
            outputs/CF_CASE_01_campi_flegrei_timeline.csv
            outputs/CF_CASE_01_campi_flegrei_timeline.png
            outputs/CF_CASE_01_non_normal_episodes.csv
            outputs/CF_CASE_01_summary.json
            outputs/CF_CASE_01_workflow_provenance.json
          if-no-files-found: error
          retention-days: 90

      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            outputs/CF_CASE_01_campi_flegrei_timeline.csv \
            outputs/CF_CASE_01_campi_flegrei_timeline.png \
            outputs/CF_CASE_01_non_normal_episodes.csv \
            outputs/CF_CASE_01_summary.json \
            outputs/CF_CASE_01_workflow_provenance.json

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m \
            "Add reproducible Campi Flegrei case-study timeline"

          git push
