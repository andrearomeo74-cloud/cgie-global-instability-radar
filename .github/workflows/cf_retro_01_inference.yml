
name: CF-RETRO-01 Run Frozen Inference

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cf-retro-01-inference
  cancel-in-progress: false

jobs:
  run-frozen-inference:
    name: Run and validate frozen retrospective inference
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cgie2.txt

      - name: Display execution context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Source commit: $GITHUB_SHA"
          echo "Workflow run ID: $GITHUB_RUN_ID"
          echo "Workflow run number: $GITHUB_RUN_NUMBER"
          echo "Workflow run attempt: $GITHUB_RUN_ATTEMPT"
          python --version
          python -m pip --version

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install frozen dependencies
        run: |
          python -m pip install -r requirements-cgie2.txt

      - name: Validate required input files run: |
          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo "===== ROOT FILES ====="
          ls -lah

          echo "===== CGIE2 ====="
          ls -lah cgie2 || true

          echo "===== CONFIG ====="
          ls -lah cgie2/config || true

          echo "===== OUTPUTS ====="
          ls -lah outputs || true

          echo "requirements"
          ls -l requirements-cgie2.txt || true

          echo "feature config"
          ls -l cgie2/config/cf_retro_01.yaml || true

          echo "inference config"
          ls -l cgie2/config/cf_retro_01_inference.yaml || true

          echo "runner"
          ls -l cgie2/src/run_cf_inference.py || true

          echo "features"
          ls -l outputs/CF_RETRO_01_features.csv || true

          echo "sha"
          ls -l outputs/CF_RETRO_01_features.csv.sha256 || true

          echo "manifest"
          ls -l outputs/CF_RETRO_01_features_manifest.json || true

          exit 0

      - name: Verify frozen feature hash
        working-directory: outputs
        run: |
          sha256sum --check CF_RETRO_01_features.csv.sha256

      - name: Validate frozen configurations
        run: |
          python - <<'PY'
          from pathlib import Path

          import yaml

          feature_config_path = Path(
              "cgie2/config/cf_retro_01.yaml"
          )

          inference_config_path = Path(
              "cgie2/config/cf_retro_01_inference.yaml"
          )

          feature_config = yaml.safe_load(
              feature_config_path.read_text(
                  encoding="utf-8"
              )
          )

          inference_config = yaml.safe_load(
              inference_config_path.read_text(
                  encoding="utf-8"
              )
          )

          if (
              feature_config["experiment"]["id"]
              != "CF_RETRO_01"
          ):
              raise SystemExit(
                  "ERROR: unexpected feature experiment ID."
              )

          if (
              feature_config["experiment"]["status"]
              != "FROZEN"
          ):
              raise SystemExit(
                  "ERROR: feature configuration is not FROZEN."
              )

          if (
              inference_config["experiment"]["id"]
              != "CF_RETRO_01"
          ):
              raise SystemExit(
                  "ERROR: unexpected inference experiment ID."
              )

          if (
              inference_config["experiment"]["stage"]
              != "inference"
          ):
              raise SystemExit(
                  "ERROR: unexpected inference stage."
              )

          if (
              inference_config["experiment"]["status"]
              != "FROZEN"
          ):
              raise SystemExit(
                  "ERROR: inference configuration is not FROZEN."
              )

          if (
              inference_config["windows"]["primary_window"]
              != "7d"
          ):
              raise SystemExit(
                  "ERROR: frozen primary window is not 7d."
              )

          expected_windows = [
              "1d",
              "3d",
              "7d",
              "30d",
          ]

          if (
              inference_config["windows"]
              ["complete_window_order"]
              != expected_windows
          ):
              raise SystemExit(
                  "ERROR: unexpected frozen window order."
              )

          if (
              inference_config["windows"]
              ["multi_window_confirmation_required"]
              != 2
          ):
              raise SystemExit(
                  "ERROR: multi-window confirmation "
                  "must equal 2."
              )

          safety_rules = inference_config[
              "safety_rules"
          ]

          required_false_rules = [
              "use_target_event_for_threshold_selection",
              "use_test_period_for_normalization",
              "use_future_observations",
              "allow_centered_windows",
              "modify_primary_window_after_run",
              "modify_selected_features_after_run",
              "modify_alert_rules_after_run",
              "allow_post_event_rows",
              "allow_silent_configuration_changes",
          ]

          for rule in required_false_rules:
              if safety_rules.get(rule) is not False:
                  raise SystemExit(
                      "ERROR: frozen safety rule "
                      f"must be false: {rule}"
                  )

          if (
              inference_config["normalization"]
              ["estimation_period"]
              != "baseline_only"
          ):
              raise SystemExit(
                  "ERROR: normalization is not baseline-only."
              )

          if (
              inference_config["baseline_thresholds"]
              ["estimation_period"]
              != "baseline_only"
          ):
              raise SystemExit(
                  "ERROR: threshold estimation "
                  "is not baseline-only."
              )

          print("Frozen configuration validation passed.")
          print(
              "Primary window: "
              + inference_config["windows"]
              ["primary_window"]
          )
          print(
              "Window order: "
              + ", ".join(expected_windows)
          )
          print(
              "Selected features: "
              + ", ".join(
                  inference_config["selected_features"]
              )
          )
          PY

      - name: Validate frozen features before inference
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import pandas as pd

          features_path = Path(
              "outputs/CF_RETRO_01_features.csv"
          )

          manifest_path = Path(
              "outputs/CF_RETRO_01_features_manifest.json"
          )

          features = pd.read_csv(
              features_path,
              encoding="utf-8",
          )

          if features.empty:
              raise SystemExit(
                  "ERROR: feature table is empty."
              )

          endpoints = pd.to_datetime(
              features["endpoint_utc"],
              utc=True,
              errors="raise",
              format="mixed",
          )

          frozen_cutoff = pd.Timestamp(
              "2026-07-31T17:46:42Z"
          )

          target_event = pd.Timestamp(
              "2026-07-31T17:46:43Z"
          )

          if endpoints.max() > frozen_cutoff:
              raise SystemExit(
                  "ERROR: features exceed frozen cutoff."
              )

          if (endpoints >= target_event).any():
              raise SystemExit(
                  "ERROR: target-event or post-event "
                  "features are present."
              )

          expected_windows = {
              "1d",
              "3d",
              "7d",
              "30d",
          }

          observed_windows = set(
              features["window_id"]
              .astype(str)
              .unique()
          )

          if observed_windows != expected_windows:
              raise SystemExit(
                  "ERROR: unexpected feature windows: "
                  + repr(observed_windows)
              )

          if features.duplicated(
              subset=[
                  "endpoint_utc",
                  "window_id",
              ],
              keep=False,
          ).any():
              raise SystemExit(
                  "ERROR: duplicate endpoint-window rows."
              )

          manifest = json.loads(
              manifest_path.read_text(
                  encoding="utf-8"
              )
          )

          if (
              manifest.get("target_event_included")
              is not False
          ):
              raise SystemExit(
                  "ERROR: feature manifest does not "
                  "exclude target event."
              )

          if (
              manifest.get("future_data_allowed")
              is not False
          ):
              raise SystemExit(
                  "ERROR: feature manifest permits "
                  "future data."
              )

          print("Frozen feature validation passed.")
          print(f"Rows: {len(features)}")
          print(
              f"First endpoint: {endpoints.min()}"
          )
          print(
              f"Final endpoint: {endpoints.max()}"
          )
          PY

      - name: Execute frozen inference engine
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python cgie2/src/run_cf_inference.py

      - name: Verify generated inference outputs
        run: |
          test -s outputs/CF_RETRO_01_normalized_features.csv
          test -s outputs/CF_RETRO_01_baseline_parameters.json
          test -s outputs/CF_RETRO_01_metrics.csv
          test -s outputs/CF_RETRO_01_thresholds.json
          test -s outputs/CF_RETRO_01_window_alerts.csv
          test -s outputs/CF_RETRO_01_global_alerts.csv
          test -s outputs/CF_RETRO_01_alert_episodes.csv
          test -s outputs/CF_RETRO_01_summary.json
          test -s outputs/CF_RETRO_01_report.md
          test -s outputs/CF_RETRO_01_metrics.csv.sha256
          test -s outputs/CF_RETRO_01_inference_manifest.json

          echo "Generated inference outputs:"
          ls -lh outputs/CF_RETRO_01_normalized_features.csv
          ls -lh outputs/CF_RETRO_01_baseline_parameters.json
          ls -lh outputs/CF_RETRO_01_metrics.csv
          ls -lh outputs/CF_RETRO_01_thresholds.json
          ls -lh outputs/CF_RETRO_01_window_alerts.csv
          ls -lh outputs/CF_RETRO_01_global_alerts.csv
          ls -lh outputs/CF_RETRO_01_alert_episodes.csv
          ls -lh outputs/CF_RETRO_01_summary.json
          ls -lh outputs/CF_RETRO_01_report.md
          ls -lh outputs/CF_RETRO_01_metrics.csv.sha256
          ls -lh outputs/CF_RETRO_01_inference_manifest.json

      - name: Verify metrics hash
        working-directory: outputs
        run: |
          sha256sum --check CF_RETRO_01_metrics.csv.sha256

      - name: Validate inference metrics and alerts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import numpy as np
          import pandas as pd

          metrics_path = Path(
              "outputs/CF_RETRO_01_metrics.csv"
          )

          window_alerts_path = Path(
              "outputs/CF_RETRO_01_window_alerts.csv"
          )

          global_alerts_path = Path(
              "outputs/CF_RETRO_01_global_alerts.csv"
          )

          episodes_path = Path(
              "outputs/CF_RETRO_01_alert_episodes.csv"
          )

          summary_path = Path(
              "outputs/CF_RETRO_01_summary.json"
          )

          manifest_path = Path(
              "outputs/CF_RETRO_01_inference_manifest.json"
          )

          metrics = pd.read_csv(
              metrics_path,
              encoding="utf-8",
          )

          window_alerts = pd.read_csv(
              window_alerts_path,
              encoding="utf-8",
          )

          global_alerts = pd.read_csv(
              global_alerts_path,
              encoding="utf-8",
          )

          episodes = pd.read_csv(
              episodes_path,
              encoding="utf-8",
          )

          summary = json.loads(
              summary_path.read_text(
                  encoding="utf-8"
              )
          )

          manifest = json.loads(
              manifest_path.read_text(
                  encoding="utf-8"
              )
          )

          if metrics.empty:
              raise SystemExit(
                  "ERROR: metrics table is empty."
              )

          required_metric_columns = {
              "endpoint_utc",
              "window_id",
              "Gamma_CF",
              "SCI",
              "CRM",
          }

          missing_metric_columns = sorted(
              required_metric_columns.difference(
                  metrics.columns
              )
          )

          if missing_metric_columns:
              raise SystemExit(
                  "ERROR: missing metric columns: "
                  + ", ".join(
                      missing_metric_columns
                  )
              )

          endpoints = pd.to_datetime(
              metrics["endpoint_utc"],
              utc=True,
              errors="raise",
              format="mixed",
          )

          frozen_cutoff = pd.Timestamp(
              "2026-07-31T17:46:42Z"
          )

          target_event = pd.Timestamp(
              "2026-07-31T17:46:43Z"
          )

          if endpoints.max() > frozen_cutoff:
              raise SystemExit(
                  "ERROR: metrics exceed frozen cutoff."
              )

          if (endpoints >= target_event).any():
              raise SystemExit(
                  "ERROR: target-event or later metrics "
                  "are present."
              )

          gamma = pd.to_numeric(
              metrics["Gamma_CF"],
              errors="raise",
          )

          sci = pd.to_numeric(
              metrics["SCI"],
              errors="raise",
          )

          crm = pd.to_numeric(
              metrics["CRM"],
              errors="coerce",
          )

          if (
              (gamma < 0.0).any()
              or (gamma > 1.0).any()
          ):
              raise SystemExit(
                  "ERROR: Gamma_CF outside [0, 1]."
              )

          if (
              (sci < 0.0).any()
              or (sci > 1.0).any()
          ):
              raise SystemExit(
                  "ERROR: SCI outside [0, 1]."
              )

          finite_crm = crm.dropna()

          if (finite_crm < 0.0).any():
              raise SystemExit(
                  "ERROR: CRM contains negative values."
              )

          expected_windows = {
              "1d",
              "3d",
              "7d",
              "30d",
          }

          if set(
              metrics["window_id"]
              .astype(str)
              .unique()
          ) != expected_windows:
              raise SystemExit(
                  "ERROR: metrics contain unexpected windows."
              )

          if metrics.duplicated(
              subset=[
                  "endpoint_utc",
                  "window_id",
              ],
              keep=False,
          ).any():
              raise SystemExit(
                  "ERROR: duplicate metric rows."
              )

          if window_alerts.empty:
              raise SystemExit(
                  "ERROR: window-alert table is empty."
              )

          valid_levels = {
              "normal",
              "attention",
              "anomaly",
              "structural",
          }

          observed_window_levels = set(
              window_alerts[
                  "window_alert_level"
              ]
              .astype(str)
              .unique()
          )

          if not observed_window_levels.issubset(
              valid_levels
          ):
              raise SystemExit(
                  "ERROR: invalid window-alert level."
              )

          if global_alerts.empty:
              raise SystemExit(
                  "ERROR: global-alert table is empty."
              )

          observed_global_levels = set(
              global_alerts[
                  "global_alert_level"
              ]
              .astype(str)
              .unique()
          )

          if not observed_global_levels.issubset(
              valid_levels
          ):
              raise SystemExit(
                  "ERROR: invalid global-alert level."
              )

          global_endpoints = pd.to_datetime(
              global_alerts["endpoint_utc"],
              utc=True,
              errors="raise",
              format="mixed",
          )

          if global_endpoints.max() > frozen_cutoff:
              raise SystemExit(
                  "ERROR: global alerts exceed cutoff."
              )

          confirming_counts = pd.to_numeric(
              global_alerts[
                  "confirming_window_count"
              ],
              errors="raise",
          )

          if (
              (confirming_counts < 0).any()
              or (confirming_counts > 4).any()
          ):
              raise SystemExit(
                  "ERROR: invalid confirming-window count."
              )

          if summary.get(
              "experiment_id"
          ) != "CF_RETRO_01":
              raise SystemExit(
                  "ERROR: unexpected summary experiment ID."
              )

          if summary.get(
              "target_event_utc"
          ) != "2026-07-31T17:46:43Z":
              raise SystemExit(
                  "ERROR: unexpected target event "
                  "in summary."
              )

          allowed_classes = {
              "no_signal",
              "coincident",
              "short_hours",
              "short_days",
              "structural",
              "remote_or_nondiscriminating",
          }

          if summary.get(
              "lead_time_class"
          ) not in allowed_classes:
              raise SystemExit(
                  "ERROR: invalid lead-time class."
              )

          alert_fraction = float(
              summary.get(
                  "test_alert_fraction",
                  -1.0,
              )
          )

          if not 0.0 <= alert_fraction <= 1.0:
              raise SystemExit(
                  "ERROR: invalid test alert fraction."
              )

          if (
              int(
                  summary.get(
                      "alert_episode_count",
                      -1,
                  )
              )
              != len(episodes)
          ):
              raise SystemExit(
                  "ERROR: episode count mismatch "
                  "between summary and CSV."
              )

          if (
              manifest.get("experiment_id")
              != "CF_RETRO_01"
          ):
              raise SystemExit(
                  "ERROR: unexpected manifest experiment ID."
              )

          if (
              manifest.get("stage")
              != "inference"
          ):
              raise SystemExit(
                  "ERROR: unexpected manifest stage."
              )

          if (
              manifest.get("target_event_included")
              is not False
          ):
              raise SystemExit(
                  "ERROR: manifest does not exclude "
                  "target event."
              )

          if (
              manifest.get("future_data_used")
              is not False
          ):
              raise SystemExit(
                  "ERROR: manifest indicates future-data use."
              )

          if (
              manifest.get("normalization_period")
              != "baseline_only"
          ):
              raise SystemExit(
                  "ERROR: normalization period "
                  "is not baseline-only."
              )

          if (
              manifest.get("threshold_period")
              != "baseline_only"
          ):
              raise SystemExit(
                  "ERROR: threshold period "
                  "is not baseline-only."
              )

          if int(
              manifest.get(
                  "metrics_rows",
                  -1,
              )
          ) != len(metrics):
              raise SystemExit(
                  "ERROR: metrics row-count mismatch."
              )

          print("Inference-output validation passed.")
          print(f"Metric rows: {len(metrics)}")
          print(
              "Global-alert rows: "
              f"{len(global_alerts)}"
          )
          print(
              "Alert episodes: "
              f"{len(episodes)}"
          )
          print(
              "First qualifying alert: "
              f"{summary.get('first_qualifying_alert_utc')}"
          )
          print(
              "Lead time hours: "
              f"{summary.get('lead_time_hours')}"
          )
          print(
              "Lead-time class: "
              f"{summary.get('lead_time_class')}"
          )
          print(
              "Test alert fraction: "
              f"{summary.get('test_alert_fraction')}"
          )
          print(
              "Permanent alert detected: "
              f"{summary.get('permanent_alert_detected')}"
          )
          PY

      - name: Create inference workflow provenance record
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          def sha256_file(path: Path) -> str:
              digest = hashlib.sha256()

              with path.open("rb") as handle:
                  for block in iter(
                      lambda: handle.read(
                          1024 * 1024
                      ),
                      b"",
                  ):
                      digest.update(block)

              return digest.hexdigest()

          output_path = Path(
              "outputs/"
              "CF_RETRO_01_inference_workflow_provenance.json"
          )

          provenance = {
              "experiment_id": "CF_RETRO_01",
              "stage": "inference",
              "workflow_name": os.environ.get(
                  "GITHUB_WORKFLOW"
              ),
              "workflow_run_id": os.environ.get(
                  "GITHUB_RUN_ID"
              ),
              "workflow_run_number": os.environ.get(
                  "GITHUB_RUN_NUMBER"
              ),
              "workflow_run_attempt": os.environ.get(
                  "GITHUB_RUN_ATTEMPT"
              ),
              "repository": os.environ.get(
                  "GITHUB_REPOSITORY"
              ),
              "repository_owner": os.environ.get(
                  "GITHUB_REPOSITORY_OWNER"
              ),
              "branch": os.environ.get(
                  "GITHUB_REF_NAME"
              ),
              "source_commit": os.environ.get(
                  "GITHUB_SHA"
              ),
              "actor": os.environ.get(
                  "GITHUB_ACTOR"
              ),
              "runner_operating_system": os.environ.get(
                  "RUNNER_OS"
              ),
              "execution_timestamp_utc": (
                  datetime.now(timezone.utc)
                  .isoformat()
                  .replace("+00:00", "Z")
              ),
              "input_features_sha256": sha256_file(
                  Path(
                      "outputs/"
                      "CF_RETRO_01_features.csv"
                  )
              ),
              "feature_configuration_sha256": sha256_file(
                  Path(
                      "cgie2/config/"
                      "cf_retro_01.yaml"
                  )
              ),
              "inference_configuration_sha256": sha256_file(
                  Path(
                      "cgie2/config/"
                      "cf_retro_01_inference.yaml"
                  )
              ),
              "inference_script_sha256": sha256_file(
                  Path(
                      "cgie2/src/"
                      "run_cf_inference.py"
                  )
              ),
              "metrics_sha256": sha256_file(
                  Path(
                      "outputs/"
                      "CF_RETRO_01_metrics.csv"
                  )
              ),
              "summary_sha256": sha256_file(
                  Path(
                      "outputs/"
                      "CF_RETRO_01_summary.json"
                  )
              ),
              "report_sha256": sha256_file(
                  Path(
                      "outputs/"
                      "CF_RETRO_01_report.md"
                  )
              ),
          }

          output_path.write_text(
              json.dumps(
                  provenance,
                  indent=2,
                  ensure_ascii=False,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )

          print(f"Created {output_path}")
          PY

      - name: Upload frozen inference artifact
        uses: actions/upload-artifact@v4
        with:
          name: CF-RETRO-01-frozen-inference
          path: |
            outputs/CF_RETRO_01_normalized_features.csv
            outputs/CF_RETRO_01_baseline_parameters.json
            outputs/CF_RETRO_01_metrics.csv
            outputs/CF_RETRO_01_metrics.csv.sha256
            outputs/CF_RETRO_01_thresholds.json
            outputs/CF_RETRO_01_window_alerts.csv
            outputs/CF_RETRO_01_global_alerts.csv
            outputs/CF_RETRO_01_alert_episodes.csv
            outputs/CF_RETRO_01_summary.json
            outputs/CF_RETRO_01_report.md
            outputs/CF_RETRO_01_inference_manifest.json
            outputs/CF_RETRO_01_inference_workflow_provenance.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Commit generated inference outputs
        run: |
          git config user.name "github-actions[bot]"
          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            outputs/CF_RETRO_01_normalized_features.csv \
            outputs/CF_RETRO_01_baseline_parameters.json \
            outputs/CF_RETRO_01_metrics.csv \
            outputs/CF_RETRO_01_metrics.csv.sha256 \
            outputs/CF_RETRO_01_thresholds.json \
            outputs/CF_RETRO_01_window_alerts.csv \
            outputs/CF_RETRO_01_global_alerts.csv \
            outputs/CF_RETRO_01_alert_episodes.csv \
            outputs/CF_RETRO_01_summary.json \
            outputs/CF_RETRO_01_report.md \
            outputs/CF_RETRO_01_inference_manifest.json \
            outputs/CF_RETRO_01_inference_workflow_provenance.json

          if git diff --cached --quiet; then
            echo "No generated inference changes to commit."
            exit 0
          fi

          git commit \
            -m "Add frozen CF-RETRO-01 inference results" \
            -m "Generated automatically from the frozen pre-event feature table and inference configuration. Includes normalized features, baseline parameters, Congruity metrics, thresholds, window and global alerts, alert episodes, summary, report, hashes and workflow provenance."

          git pull \
            --rebase \
            origin \
            "$GITHUB_REF_NAME"

          git push \
            origin \
            "HEAD:$GITHUB_REF_NAME"
           
